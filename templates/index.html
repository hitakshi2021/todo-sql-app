<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker To-Do App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 My Docker To-Do List</h1>
        
        <!-- Task Add Form -->
        <form action="/add" method="POST" class="todo-form">
            <input type="text" name="task" placeholder="Enter a new task..." required autocomplete="off">
            <button type="submit">Add Task</button>
        </form>

        <!-- Task List -->
        <ul class="todo-list">
            {% for todo in todos %}
                <li>
                    <span>{{ todo[1] }}</span>
                    <a href="/delete/{{ todo[0] }}" class="delete-btn">Delete</a>
                </li>
            {% else %}
                <p class="empty-msg">No tasks yet. Add one above! 🎉</p>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
